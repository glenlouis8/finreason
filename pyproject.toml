[project]
name = "finreason"
version = "0.1.0"
description = "Financial Reasoning LLM: SFT + DPO alignment pipeline on FinQA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=0.28.0",
    "bitsandbytes>=0.43.0",
    "datasets>=2.18.0",
    "huggingface-hub>=0.22.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "peft>=0.10.0",
    "pyyaml>=6.0.1",
    "scipy>=1.12.0",
    "torch>=2.1.0",
    "tqdm>=4.66.0",
    "transformers>=4.40.0",
    "trl>=0.8.6",
    "wandb>=0.16.0",
]

[project.optional-dependencies]
# Serving/eval-against-an-endpoint only. Deliberately separate: the serving box
# runs vLLM in its own venv and must not pull the training stack.
serving = [
    "openai>=1.30.0",
    "locust>=2.24.0",
]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
# Repo root on sys.path so `from src...` resolves without an editable install,
# matching how the scripts/ entry points import.
pythonpath = ["."]
testpaths = ["tests"]

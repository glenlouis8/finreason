name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # A venv, not --system: the runner's Python is externally managed (PEP 668)
      # and refuses system-wide installs.
      - name: Create venv and install test deps
        run: |
          uv venv --python 3.12
          uv pip install pytest pyyaml scipy

      # Best-effort: downloads FinQA so the data-contract tests actually run.
      # They skip cleanly when data/ is absent, so a GitHub outage or a moved
      # raw.githubusercontent URL degrades coverage instead of failing the build.
      - name: Build FinQA splits
        continue-on-error: true
        run: |
          uv run --no-project python -c "
          from src.data_utils import load_finqa_sft, save_jsonl
          tr, dv, te = load_finqa_sft()
          save_jsonl(tr, 'data/sft_train.jsonl')
          save_jsonl(dv, 'data/sft_dev.jsonl')
          save_jsonl(te, 'data/sft_test.jsonl')
          print(f'train {len(tr)} / dev {len(dv)} / test {len(te)}')
          "

      - name: Run tests
        run: uv run --no-project pytest -v

      # Fails the build if the newest committed results/eval_*.json drops below
      # the accuracy floors, or if base accuracy collapses back toward zero
      # (the signature of a regressed answer parser).
      - name: Metric regression gate
        run: uv run --no-project pytest tests/test_metrics.py -v -k "committed or artifact"
